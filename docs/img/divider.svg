<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="presentation" aria-hidden="true">
<style>
.p{animation:p 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.5);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#0F2D69"/><stop offset="0.55" stop-color="#1E50C8"/><stop offset="1" stop-color="#4C8DF6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="h"><stop offset="0" stop-color="#8FBBFF"/><stop offset="1" stop-color="#8FBBFF" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0" y="11" width="1200" height="6" rx="3" fill="url(#g)"/>
<circle cx="14" cy="14" r="9" fill="#0F2D69"/><circle class="p" cx="14" cy="14" r="4" fill="#fff"/>
<circle class="p" style="animation-delay:.4s" cx="52" cy="14" r="4" fill="#1E50C8"/><circle class="p" style="animation-delay:.8s" cx="76" cy="14" r="2.5" fill="#4C8DF6"/>
<g>
  <circle r="12" cy="14" fill="url(#h)"><animate attributeName="cx" values="90;1100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="5s" repeatCount="indefinite"/></circle>
  <circle r="3" cy="14" fill="#fff"><animate attributeName="cx" values="90;1100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="5s" repeatCount="indefinite"/></circle>
</g>
</svg>